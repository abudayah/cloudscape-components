name: Build Cloudscape with One Theme

on:
  push:
    branches:
      - one-theme-build
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-theme-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build One Theme package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          HUSKY: 0

      - name: Build component package with One Theme enabled
        run: npm run quick-build
        env:
          NODE_ENV: production
          INCLUDE_ONE_THEME: 'true'
          HUSKY: 0

      - name: Verify One Theme was compiled into the package
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const environmentPath = path.join('lib', 'components', 'internal', 'environment.json');
          if (!fs.existsSync(environmentPath)) {
            throw new Error(`Missing generated environment file: ${environmentPath}`);
          }

          const environment = JSON.parse(fs.readFileSync(environmentPath, 'utf8'));
          if (environment.INCLUDE_ONE_THEME !== true) {
            throw new Error('INCLUDE_ONE_THEME was not enabled in the generated package.');
          }

          function findOneThemeSelectors(directory) {
            const matches = [];
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const entryPath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                matches.push(...findOneThemeSelectors(entryPath));
              } else if (/\.(?:js|cjs|mjs|css)$/.test(entry.name)) {
                const source = fs.readFileSync(entryPath, 'utf8');
                if (source.includes('awsui-one-theme')) {
                  matches.push(entryPath);
                }
              }
            }
            return matches;
          }

          const matchingFiles = findOneThemeSelectors(path.join('lib', 'components'));
          if (matchingFiles.length === 0) {
            throw new Error('No generated component stylesheet contains the One Theme selector.');
          }

          console.log('Verified: One Theme is enabled and its selector appears in:', matchingFiles.join(', '));
          NODE

      - name: Pack the built components package
        run: |
          mkdir -p artifacts
          npm pack ./lib/components --pack-destination artifacts
          test -n "$(find artifacts -maxdepth 1 -name '*.tgz' -print -quit)"

      - name: Publish a prerelease asset for app integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_TARBALL="$(find artifacts -maxdepth 1 -name '*.tgz' -print -quit)"
          TAG="one-theme-build-${GITHUB_SHA:0:12}"
          gh release create "$TAG" "$PACKAGE_TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cloudscape One Theme build ${GITHUB_SHA:0:7}" \
            --notes "Built from ${GITHUB_SHA} with INCLUDE_ONE_THEME=true. This prerelease contains the compiled @cloudscape-design/components package for MokhaLab integration." \
            --prerelease

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudscape-components-one-theme
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 30
